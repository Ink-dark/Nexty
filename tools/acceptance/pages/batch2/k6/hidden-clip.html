<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>K6 hidden 裁剪</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  .box { overflow: hidden; width: 420px; height: 160px; border: 2px solid #363; padding: 8px; background-color: #eeffee; }
  .block { height: 40px; background-color: #c8e6c9; margin: 6px 0; }
  p { margin: 6px 0; }
</style>
</head>
<body>
<h3>K6 hidden clip：overflow:hidden 只裁剪、不滚动</h3>
<ol>
  <li>绿框容器（高 160px）只显示顶部内容，第 3 块下半起被裁掉、不可见；</li>
  <li>容器右缘没有滚动条（hidden 不产生滚动条）；</li>
  <li>滚轮悬停容器：容器内容不动（hidden 不可滚），页面照常滚动（冒泡越过 hidden 容器）；</li>
  <li>被裁掉的内容不应渗出容器边框之外。</li>
</ol>

<div class="box">
  <p>容器首行（可见）</p>
  <div class="block">1</div>
  <div class="block">2</div>
  <div class="block">3（下半被裁剪）</div>
  <div class="block">4（不可见）</div>
  <div class="block">5（不可见）</div>
  <div class="block">6（不可见）</div>
  <p>容器末行（不可见）</p>
</div>
<p>容器之后的正文（页面滚动时可见）。</p>
</body>
</html>
