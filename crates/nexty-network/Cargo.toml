[package]
name = "nexty-network"
description = "Nexty 网络 facade"
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 默认开启全部已实现能力；下游（nexty-chrome）依赖默认即可获得完整网络栈。
default = ["fetch", "resolve", "decode", "cache"]
# 抓取后端（reqwest）与 NetworkFetcher trait / Request / Response 类型。
fetch = ["dep:reqwest"]
# 相对 URL 解析（WHATWG basic URL parsing），直依赖 `url` crate，不拉 reqwest。
# 选型见 docs/decisions/2026-10-31-url.md。
resolve = ["dep:url"]
# 主文档字符编码探测与解码：HTTP charset > BOM > meta 预扫 > UTF-8。
# 选型见 docs/decisions/2026-10-31-encoding.md。
decode = ["dep:encoding_rs"]
# 内存级 HTTP 缓存（Cache-Control / ETag / Last-Modified / LRU），
# 以装饰器实现 NetworkFetcher，故隐含 fetch。
cache = ["fetch"]

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
url = { version = "2.5.8", optional = true }
encoding_rs = { version = "0.8.42", optional = true }
