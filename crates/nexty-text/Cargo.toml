[package]
name = "nexty-text"
description = "Nexty 文本整形与字体 facade"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 默认开启全部已实现能力；下游（nexty-layout / nexty-paint / nexty-chrome）
# 依赖默认即可获得整形 + 字体解析。
default = ["shaping", "font-resolution"]
# 单行文本整形：TextShaper trait 与 parley（fontique + harfrust）实现。
# ParleyTextShaper 的字体解析复用 FontResolver，故隐含 font-resolution。
shaping = ["dep:parley", "font-resolution"]
# 字体文件解析：FontResolver / ResolvedFont，供 paint 取字体字节。
font-resolution = ["dep:parley"]

[dependencies]
# parley 内部经 fontique 选字、harfrust 整形；swash 自 parley 0.11 起不再参与
parley = { version = "0.11.1", optional = true }

[dev-dependencies]
# 仅测试用：校验 ResolvedFont 字节可被 skrifa 读为合法 face。
# 生产代码不引用 skrifa（字体解析走 parley），故不应进正式依赖——
# 它是 parley 的传递依赖，留在这里只为测试断言。
skrifa = "0.44.0"
