[package]
name = "nexty-layout"
description = "Nexty 自研盒级布局"
version = "0.1.21"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 默认开启全部已实现能力；下游 nexty-chrome 依赖默认即可获得完整布局栈。
# 未实现的能力（table）不在 default 中，feature 槽位已预留，待对应任务落地时
# 补全实现并加入 default。
default = ["block", "inline", "flex", "replaced", "taffy-map", "grid", "absolute", "selection"]
# 块级流：几何解算由 taffy 接管（CSS 2.1 §9.2 / §10.3 / §10.5–10.7）。taffy
# 管线是块级流的唯一实现，故隐含 inline（行内断行喂给匿名块 measure 节点）与
# taffy-map（盒树构建 + 样式映射）。
block = ["inline", "taffy-map"]
# 行内流：行内项收集、空白折叠、贪心断行与行盒组装（taffy 不做文本布局，
# 永久自研；CSS 2.1 §9.2.2 / §10.8、CSS Text §3/§7）。
inline = []
# 弹性布局：flex 容器的子项 blockify（tree_build）与 taffy Display::Flex 映射
# （style_map）；主轴/交叉轴几何（含 wrap/shrink/对齐值）由 taffy 的 flexbox
# 算法解算（CSS Flexbox）。
flex = ["block"]
# 替换元素：块级与行内替换盒（<img>）的自然尺寸与内在尺寸测量。
replaced = []
# Grid 布局：grid-* 样式映射与 Display::Grid 映射（style_map）；轨道/放置几何
# 由 taffy 的 grid 算法解算（CSS Grid）。grid item 生成沿用盒树构建的收集走法：
# 块级子盒成 item，行内内容经匿名块成 item（CSS Grid §3.2 匿名项）。
grid = []
# 预留：表格布局，当前未实现故不在 default。
table = []
# 绝对/固定定位：position 与 inset 样式映射（style_map）；几何由 taffy 解算
# （taffy 相对树内父盒定位，不做「最近定位祖先」搜索，偏差见 style_map 文档）。
absolute = []
# ComputedStyle → taffy::Style 映射层（style_map）与盒树构建（tree_build）。
# 块级流的 taffy 管线复用 inline 模块断行，故依赖 inline。
taffy-map = ["inline"]
# 文本选区几何：命中、选区矩形与复制文本重建（消费 Fragment 树，隐含 block）。
selection = ["block"]

[dependencies]
nexty-dom = { path = "../nexty-dom", version = "0.1.0" }
nexty-css = { path = "../nexty-css", version = "0.1.0" }
nexty-text = { path = "../nexty-text", version = "0.1.0" }
# taffy 接管盒级几何（block/flex/grid/absolute）；inline 与 table 仍自研。
# 选型与边界见 docs/decisions/2026-10-01-crate-selection.md 修正记录。
taffy = "0.14"
# 断行是布局层职责（text 层保持纯整形）：UAX#29 扩展字形簇边界
# （cluster 不得跨字形簇切分；UAX#14 规则自研，见 src/inline.rs）。
unicode-segmentation = "1.13.3"

[dev-dependencies]
nexty-html = { path = "../nexty-html", version = "0.1.0" }
# 仅测试用 oracle：harfrust 独立整形出 glyph cluster（UAX#14 断行与 cluster
# 覆盖断言）。生产整形仍在 nexty-text（parley/harfrust）。
# 不选 rustybuzz：RUSTSEC-2026-0206 已标记其无人维护，官方替代即 harfrust。
harfrust = "0.12.0"
