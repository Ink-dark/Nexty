name: Release

# 持续交付：推送 `v*` 标签（或手动 workflow_dispatch）时，于各平台原生 runner
# 上构建发布二进制、跑测试、打包 tar.gz（+sha256）、生成依赖许可证清单，
# 并发布为 GitHub Release 制品。
#
# 发版步骤：
#   1. 在 main 上完成改动并合并；
#   2. `git tag vX.Y.Z && git push origin vX.Y.Z`；
#   3. 本工作流自动构建 Linux / Windows 制品并创建 Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)。留空则使用本次运行所在的 tag/ref。"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------- 各平台原生构建 + 测试 + 打包 ----------
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libtss2-dev libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev vulkan-tools libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # 发布前确保该提交测试全绿（nexty-chrome 测试为无头逻辑测试，无需窗口）
      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin nexty --target ${{ matrix.target }}

      - name: Package (tar.gz + sha256)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="nexty${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release/$BIN"
          # Linux 额外剥离符号（Windows 由 [profile.release] strip=true 处理）
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            strip "$SRC"
          fi
          tar -czf "dist/nexty-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          sha256sum "dist/nexty-${{ matrix.target }}.tar.gz" > "dist/nexty-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nexty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------- 汇总制品并发布 GitHub Release ----------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate dependency license report (cargo-about)
        run: cargo about generate about.hbs -o dependencies.html

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*
            dependencies.html
