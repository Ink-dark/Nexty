[workspace]
# Nexty workspace（MusKitty 不造轮子分支）。
# 分层与 crate 选型见 docs/decisions/2026-10-01-crate-selection.md
members = [
    "crates/nexty-dom",
    "crates/nexty-html",
    "crates/nexty-css",
    "crates/nexty-layout",
    "crates/nexty-text",
    "crates/nexty-paint",
    "crates/nexty-network",
    "crates/nexty-chrome",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Ink-dark/Nexty"
# MSRV 基线：1.90。取依赖中最高 MSRV 并留出余量
# （vello_cpu 的 MSRV 历史在 1.88–1.92 间抖动，
#  见 docs/decisions/2026-10-01-crate-selection.md）
rust-version = "1.90"

# 发布制品：剥离符号以减小体积（Release 流水线据此产出更小二进制）
[profile.release]
strip = true